<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="100%" height="100%">
  <!-- 
    Logo AUCHAN basé sur l'image fournie.
    Utilisation d'une police sans-serif très grasse (Arial Black/Impact) 
    pour reproduire l'aspect massif des lettres.
    La couleur correspond au rouge du bouton et du logo de la maquette.
  -->
  <defs>
    <style>
      .logo-text {
        font-family: 'Arial Black', 'Impact', 'Helvetica Neue', Helvetica, sans-serif;
        font-size: 44px;
        font-weight: 900;
        fill: #C3151C; /* Couleur rouge foncée similaire à la maquette */
        letter-spacing: 0.5px;
      }
    </style>
  </defs>
  
  <text x="5" y="45" class="logo-text">AUCHAN</text>
</svg>